
{% load static %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>استمارة التسجيل - CRBT 1963</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #e9edf3;
            font-family: Arial, sans-serif;
        }

        .toolbar {
            text-align: center;
            margin-bottom: 20px;
        }

        .print-button {
            background: #07182f;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .print-button:hover {
            background: #f59e0b;
            color: #07182f;
        }

        .paper {
            width: 210mm;
            margin: auto;
            background: white;
            line-height: 0;
            box-shadow: 0 5px 30px #0002;
        }

        .paper img {
            display: block;
            width: 100%;
            height: auto;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body {
                padding: 0;
                margin: 0;
                background: white;
            }

            .toolbar {
                display: none !important;
            }

            .paper {
                width: 210mm;
                height: 297mm;
                margin: 0;
                box-shadow: none;
            }

            .paper img {
                width: 210mm;
                height: 297mm;
            }
        }

        @media screen and (max-width: 800px) {
            body {
                padding: 10px;
            }

            .paper {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <button class="print-button" onclick="window.print()">
            🖨️ طباعة الاستمارة
        </button>
    </div>

    <div class="paper">
        <img
    src="{% static 'registrations/images/crbt-registration-form.png' %}"
    alt="CRBT Registration Form"
>
    </div>

</body>
</html>
